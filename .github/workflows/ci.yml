name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run Swift tests
        run: swift test
      - name: Build Universal 2 app and CLI
        run: bash Scripts/build-app.sh
